[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-ur5-sim"
version = "0.1.0"
description = "Local MuJoCo/robosuite VLA grasping loop for a UR5-class arm"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.3,<3.4",
  "robosuite>=1.5.2,<1.6",
  "opencv-python>=4.10,<4.12",
  "numba>=0.59,<0.60",
]
vla = [
  "lerobot==0.4.4",
  "peft==0.17.1",
  "num2words==0.5.14",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
