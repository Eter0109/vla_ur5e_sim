# Conservative starting point for an RTX 3060 Laptop with 6 GiB VRAM.
model_id: lerobot/smolvla_base
dataset_root: data/lerobot/ur5e_custom_lift
output_dir: outputs/smolvla_lora

device: cuda
use_amp: true
batch_size: 1
steps: 2000
num_workers: 0
save_freq: 500
log_freq: 20

policy:
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true
  resize_imgs_with_padding: [512, 512]
  chunk_size: 16
  n_action_steps: 1
  num_steps: 10
  push_to_hub: false

peft:
  method_type: LORA
  r: 4
